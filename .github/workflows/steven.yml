name: CI/CD Steven

on:
  push:
    branches: [ steven ]
  pull_request:
    branches: [ steven ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies (if exists)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No se encontró requirements.txt, continuando..."
          fi

      - name: Run tests (if pytest available)
        run: |
          if pip show pytest > /dev/null 2>&1; then
            pytest || echo "No se encontraron tests, continuando..."
          else
            echo "pytest no está instalado, saltando tests..."
          fi

  docker:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # 🔹 Login a DockerHub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🔹 Construir y subir imagen a DockerHub
      - name: Build and push Docker image to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/steven_app:latest

      # 🔹 Publicar imagen también en GitHub Packages
      - name: Publicar imagen en GitHub Packages
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/steven_app:latest ghcr.io/${{ github.repository_owner }}/steven_app:latest
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/steven_app:latest
