name: CI/CD Steven

on:
  push:
    branches: [ steven ]
  pull_request:
    branches: [ steven ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run tests
        run: |
          if pip show pytest > /dev/null 2>&1; then
            pytest || echo "Sin tests definidos"
          fi

  docker:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/steven_app:latest .

      - name: Push to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/steven_app:latest

      - name: Login to GitHub Container Registry (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag and Push to GHCR
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/steven_app:latest
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/steven_app:latest $IMAGE_ID
          docker push $IMAGE_ID

